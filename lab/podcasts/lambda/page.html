<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Podcasts · selfdriven.institute</title>
<meta name="description" content="Audio conversations from the selfdriven Institute.">
<link rel="alternate" type="application/rss+xml" title="selfdriven.institute Podcasts" href="/feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2ed;--surface:#edeae3;--surface2:#e5e1d8;--border:#ddd8ce;--text:#1a1410;--muted:#6b5f52;--muted2:#9e9085;--accent:#c8442f;--accent-dim:rgba(200,68,47,.10);--accent-strong:rgba(200,68,47,.18);--card-radius:20px;--shadow:0 2px 16px rgba(0,0,0,.07)}
@media (prefers-color-scheme:dark){:root{--bg:#0a0a0a;--surface:#161616;--surface2:#1e1e1e;--border:#2a2a2a;--text:#f0ede8;--muted:#b0a89e;--muted2:#7a7268;--accent:#e85d4a;--accent-dim:rgba(232,93,74,.12);--accent-strong:rgba(232,93,74,.20);--shadow:0 2px 16px rgba(0,0,0,.4)}}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Poppins,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;padding-bottom:140px}
a{color:inherit}
.mono{font-family:'JetBrains Mono',monospace}
nav{position:sticky;top:0;z-index:10;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:color-mix(in srgb,var(--bg) 80%,transparent);border-bottom:1px solid var(--border)}
.nav-in{max-width:960px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px}
.mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:-.04em}
.brand{font-weight:700;letter-spacing:-.02em;text-decoration:none}
.brand span{color:var(--accent)}
.nav-links{margin-left:auto;display:flex;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:1px solid var(--border);font-size:13px;font-weight:600;text-decoration:none;color:var(--muted);background:transparent}
.pill:hover{color:var(--text);border-color:var(--accent)}
main{max-width:960px;margin:0 auto;padding:0 20px}
header.hero{padding:64px 0 32px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
h1{font-size:clamp(36px,7vw,64px);font-weight:900;letter-spacing:-.04em;line-height:1.02}
h1 em{font-style:normal;color:var(--accent)}
.lede{color:var(--muted);max-width:560px;margin-top:16px;font-size:17px}
.toolbar{display:flex;gap:12px;align-items:center;margin:28px 0 20px;flex-wrap:wrap}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.search svg{flex:none}
.search input{flex:1;border:0;outline:0;background:transparent;font:inherit;color:var(--text);font-size:15px}
.count{font-size:13px;color:var(--muted)}
.list{display:grid;gap:10px;list-style:none;padding:0}
.ep{position:relative;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--border);cursor:pointer;transition:box-shadow .2s,border-color .2s;overflow:hidden}
.ep::before{content:'';position:absolute;inset:0 0 auto 0;height:3px;background:var(--accent);opacity:0;transition:opacity .2s}
.ep:hover{box-shadow:var(--shadow)}
.ep:hover::before,.ep.active::before{opacity:1}
.ep.active{border-color:var(--accent);background:var(--accent-dim)}
.ep-btn{flex:none;width:40px;height:40px;border-radius:999px;border:0;background:var(--accent-dim);color:var(--accent);display:grid;place-items:center;cursor:pointer}
.ep.active .ep-btn{background:var(--accent);color:#fff}
.ep-art{flex:none;width:40px;height:40px;border-radius:10px;object-fit:cover}
.ep-body{flex:1;min-width:0}
.ep-title{font-weight:600;font-size:15px;line-height:1.35}
.ep-meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:10px;flex-wrap:wrap}
.ep-meta a{color:var(--muted);text-decoration:none}
.ep-meta a:hover{color:var(--accent)}
.ep-prog{height:3px;border-radius:2px;background:var(--surface2);margin-top:8px;overflow:hidden;display:none}
.ep-prog i{display:block;height:100%;background:var(--accent)}
.ep-prog.on{display:block}
.empty{padding:40px;text-align:center;color:var(--muted)}
.extras{margin:48px 0 0}
.extras[hidden]{display:none}
.extras ul{list-style:none;padding:0;display:grid;gap:8px}
.extras a{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;border:1px solid var(--border);text-decoration:none;color:var(--muted)}
.extras a span:nth-child(2){flex:1;color:var(--text);font-weight:500}
.extras .mono{font-size:12px}
footer{max-width:960px;margin:56px auto 0;padding:24px 20px;border-top:1px solid var(--border);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.player{position:fixed;left:12px;right:12px;bottom:12px;z-index:20;max-width:960px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--accent);border-radius:var(--card-radius);box-shadow:0 8px 32px rgba(0,0,0,.18);padding:14px 18px;display:none}
.player.on{display:block}
.p-top{display:flex;align-items:center;gap:12px}
.p-title{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-ctrls{display:flex;align-items:center;gap:6px}
.p-ctrls button{border:0;background:transparent;color:var(--text);width:38px;height:38px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.p-ctrls button:hover{background:var(--surface2)}
.p-ctrls .main{background:var(--accent);color:#fff;border-radius:999px;width:44px;height:44px}
.p-ctrls .main:hover{background:var(--accent)}
.p-rate{font:600 12px 'JetBrains Mono',monospace!important;width:auto!important;padding:0 10px}
.p-bot{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:var(--muted)}
.p-bot input{flex:1;accent-color:var(--accent)}
.p-status{font-size:12px;color:var(--muted)}
@media (max-width:560px){.p-title{font-size:13px}.p-ctrls .skip{display:none}.nav-links .pill span{display:none}}
</style>
</head>
<body>
<nav><div class="nav-in">
  <div class="mark">sd</div>
  <a class="brand" href="https://selfdriven.institute">selfdriven<span>.institute</span></a>
  <div class="nav-links">
    <a class="pill" href="/feed.xml"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg><span>RSS</span></a>
    <a class="pill" href="{{REPO_URL}}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg><span>Source</span></a>
  </div>
</div></nav>

<main>
  <header class="hero">
    <p class="eyebrow">Podcasts</p>
    <h1>Listen to the <em>institute</em>.</h1>
    <p class="lede">Conversations on identity, intelligence, coordination and human agency, published openly from the selfdriven Institute repository.</p>
  </header>

  <div class="toolbar">
    <label class="search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="q" type="search" placeholder="Search episodes" autocomplete="off" aria-label="Search episodes"></label>
    <span class="count" id="count"></span>
  </div>

  <ul class="list" id="list"></ul>
  <section class="extras" id="extras" hidden><p class="eyebrow">Also in this folder</p><ul id="extrasList"></ul></section>
</main>

<footer>
  <span>selfdriven Foundation</span>
  <span class="mono">Updated {{UPDATED}} UTC</span>
</footer>

<div class="player" id="player" role="region" aria-label="Player">
  <div class="p-top">
    <div class="p-title" id="pTitle"></div>
    <div class="p-ctrls">
      <button class="skip" id="pBack" aria-label="Back 15 seconds"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
      <button class="main" id="pPlay" aria-label="Play"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg></button>
      <button class="skip" id="pFwd" aria-label="Forward 30 seconds"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
      <button class="p-rate" id="pRate" aria-label="Playback speed">1×</button>
    </div>
  </div>
  <div class="p-bot">
    <span class="mono" id="pCur">0:00</span>
    <input type="range" id="pSeek" min="0" max="1000" value="0" aria-label="Seek">
    <span class="mono" id="pDur">--:--</span>
  </div>
</div>
<audio id="audio" preload="none"></audio>

<script>
const DATA = {{DATA}};
const EPISODES = DATA.episodes;
const ICON_FILE = "<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z\"/><path d=\"M14 2v4a2 2 0 0 0 2 2h4\"/></svg>";
const ICON_PLAY = "<svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><polygon points=\"6 3 20 12 6 21 6 3\"/></svg>";
const ICON_PAUSE = "<svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"14\" y=\"4\" width=\"4\" height=\"16\" rx=\"1\"/><rect x=\"6\" y=\"4\" width=\"4\" height=\"16\" rx=\"1\"/></svg>";
const RATES = [1, 1.25, 1.5, 1.75, 2];
const $ = (id) => document.getElementById(id);
const audio = $('audio');
let current = null;

function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
const positions = store('sdp.positions') || {};
function fmt(s) { if (!isFinite(s)) return '--:--'; s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, '0'); return h ? h + ':' + String(m).padStart(2, '0') + ':' + x : m + ':' + x; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

function render() {
  const q = $('q').value.trim().toLowerCase();
  const list = EPISODES.filter(e => !q || e.title.toLowerCase().includes(q));
  $('count').textContent = list.length + ' of ' + EPISODES.length + ' episodes';
  $('list').innerHTML = list.length ? list.map(e => {
    const p = positions[e.slug];
    const pct = p && p.d ? Math.min(100, p.t / p.d * 100) : 0;
    const playing = current === e && !audio.paused;
    return '<li class="ep' + (current === e ? ' active' : '') + '" data-slug="' + esc(e.slug) + '" id="ep-' + esc(e.slug) + '">' +
      '<button class="ep-btn" aria-label="' + (playing ? 'Pause ' : 'Play ') + esc(e.title) + '">' + (playing ? ICON_PAUSE : ICON_PLAY) + '</button>' +
      (e.art ? '<img class="ep-art" src="' + esc(e.art) + '" alt="" loading="lazy">' : '') +
      '<div class="ep-body"><div class="ep-title">' + esc(e.title) + '</div>' +
      '<div class="ep-meta"><span class="mono">' + (e.size / 1048576).toFixed(1) + ' MB</span>' +
      (p && p.d ? '<span class="mono">' + fmt(p.t) + ' / ' + fmt(p.d) + '</span>' : '') +
      e.companions.map(c => '<a href="' + esc(c.url) + '" target="_blank" rel="noopener">' + esc(c.name) + '</a>').join('') +
      '<a href="' + esc(e.source) + '" target="_blank" rel="noopener">GitHub</a></div>' +
      '<div class="ep-prog' + (pct ? ' on' : '') + '"><i style="width:' + pct.toFixed(1) + '%"></i></div></div></li>';
  }).join('') : '<li class="empty">No episodes match.</li>';
}

function play(e) {
  if (current === e) { audio.paused ? audio.play() : audio.pause(); return; }
  current = e;
  audio.src = e.audio;
  const p = positions[e.slug];
  audio.addEventListener('loadedmetadata', function once() { audio.removeEventListener('loadedmetadata', once); if (p && p.t && p.d && p.t < p.d - 10) audio.currentTime = p.t; }, { once: true });
  audio.playbackRate = store('sdp.rate') || 1;
  audio.play().catch(() => {});
  $('player').classList.add('on');
  $('pTitle').textContent = e.title;
  history.replaceState(null, '', '#' + encodeURIComponent(e.slug));
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: e.title, artist: 'selfdriven.institute', artwork: e.art ? [{ src: e.art }] : [] });
  }
  render();
}

function step(dir) {
  if (!current) return;
  const i = EPISODES.indexOf(current) + dir;
  if (EPISODES[i]) play(EPISODES[i]);
}

$('list').addEventListener('click', (ev) => {
  if (ev.target.closest('a')) return;
  const li = ev.target.closest('.ep');
  if (!li) return;
  const e = EPISODES.find(x => x.slug === li.dataset.slug);
  if (e) play(e);
});
$('q').addEventListener('input', render);
$('pPlay').onclick = () => current && (audio.paused ? audio.play() : audio.pause());
$('pBack').onclick = () => { audio.currentTime = Math.max(0, audio.currentTime - 15); };
$('pFwd').onclick = () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 30); };
$('pRate').onclick = () => { const r = RATES[(RATES.indexOf(audio.playbackRate) + 1) % RATES.length] || 1; audio.playbackRate = r; store('sdp.rate', r); $('pRate').textContent = r + '×'; };
$('pSeek').oninput = (ev) => { if (audio.duration) audio.currentTime = ev.target.value / 1000 * audio.duration; };

let lastSave = 0;
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  $('pCur').textContent = fmt(audio.currentTime);
  $('pDur').textContent = fmt(audio.duration);
  $('pSeek').value = Math.round(audio.currentTime / audio.duration * 1000);
  if (Date.now() - lastSave > 5000 && current) { lastSave = Date.now(); positions[current.slug] = { t: audio.currentTime, d: audio.duration }; store('sdp.positions', positions); }
});
audio.addEventListener('play', () => { $('pPlay').innerHTML = ICON_PAUSE; $('pPlay').setAttribute('aria-label', 'Pause'); render(); });
audio.addEventListener('pause', () => { $('pPlay').innerHTML = ICON_PLAY; $('pPlay').setAttribute('aria-label', 'Play'); if (current) { positions[current.slug] = { t: audio.currentTime, d: audio.duration }; store('sdp.positions', positions); } render(); });
audio.addEventListener('ended', () => { if (current) { positions[current.slug] = { t: 0, d: audio.duration }; store('sdp.positions', positions); } step(1); });
audio.addEventListener('ratechange', () => { $('pRate').textContent = audio.playbackRate + '×'; });

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => audio.play());
  navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  navigator.mediaSession.setActionHandler('seekbackward', () => $('pBack').click());
  navigator.mediaSession.setActionHandler('seekforward', () => $('pFwd').click());
  navigator.mediaSession.setActionHandler('previoustrack', () => step(-1));
  navigator.mediaSession.setActionHandler('nexttrack', () => step(1));
}

if (DATA.extras.length) {
  $('extrasList').innerHTML = DATA.extras.map(x => '<li><a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + ICON_FILE + '<span>' + esc(x.title) + '</span><span class="mono">' + esc(x.ext.toUpperCase()) + ' · ' + (x.size / 1048576).toFixed(1) + ' MB</span></a></li>').join('');
  $('extras').hidden = false;
}
render();
const hash = decodeURIComponent(location.hash.slice(1));
if (hash) {
  const e = EPISODES.find(x => x.slug === hash);
  const el = e && document.getElementById('ep-' + e.slug);
  if (el) { el.classList.add('active'); el.scrollIntoView({ block: 'center' }); }
}
</script>
</body>
</html>
